# Credential injection for api.github.com. The sandbox only ever sees a placeholder in
# PRAGENT_GITHUB_TOKEN; OpenShell swaps in the real token at egress.
# Modeled on NemoClaw's tavily-hermes-v1 profile (Apache-2.0).
id: pr-agent-github-v1
display_name: GitHub API for the PR agent
description: Classic GitHub token (public_repo) for forking, pushing through the Git Data API, opening PRs and commenting
category: agent
credentials:
  - name: token
    description: Classic GitHub personal access token (public_repo scope) for the agent's account
    env_vars:
      - PRAGENT_GITHUB_TOKEN
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ''
endpoints:
  - host: api.github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "/**" }
      # Only the writes src/pr_agent/github.py makes. No merges, transfers, repo
      # settings, new issues or reviews, whatever the model tries.
      - allow: { method: POST, path: "/repos/*/*/forks" }
      - allow: { method: POST, path: "/repos/*/*/merge-upstream" }
      - allow: { method: POST, path: "/repos/*/*/git/blobs" }
      - allow: { method: POST, path: "/repos/*/*/git/trees" }
      - allow: { method: POST, path: "/repos/*/*/git/commits" }
      - allow: { method: POST, path: "/repos/*/*/git/refs" }
      - allow: { method: PATCH, path: "/repos/*/*/git/refs/heads/pr-agent/**" }
      - allow: { method: POST, path: "/repos/*/*/pulls" }
      - allow: { method: POST, path: "/repos/*/*/issues/*/comments" }
      - allow: { method: POST, path: "/repos/*/*/pulls/*/comments/*/replies" }
binaries:
  - /sandbox/.pr-agent/bin/python
inference_capable: false

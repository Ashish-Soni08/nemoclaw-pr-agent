# Discovery query bank (design: /mnt/project-files/discovery/discovery-design.md).
# Editable without code changes. Every run takes the next topics_per_run topics
# and shapes_per_run shapes in the rotation (state/rotation.json).

# One language per query, rotating (Ashish 2026-10-02: Python, JavaScript, TypeScript; not Rust).
languages: [Python, JavaScript, TypeScript]
min_stars: 200
max_stars: 30000
k: 20
topics_per_run: 3
shapes_per_run: 2
max_verify_per_run: 40
max_candidates_per_run: 8
max_credits_per_run: 1000      # effectively uncapped: a normal run spends about 15
max_credits_per_month: 70000   # Ashish's whole Firecrawl credit
precedent_reserve_credits: 10   # held back from search so survivors get a precedent query
recheck_after_days: 14

# Repos the owner points the agent at. Each run lists their open, unassigned issues (with
# `label` if set, most recently updated first) straight from GitHub (no Index credits),
# ahead of the topic search, and runs them through the same checks (stars window aside). `claim_required` makes every issue ask-first:
# claim, then build only once assigned. `rules` goes to triage with each candidate.
pinned:
  - repo: kestra-io/kestra
    label: good first issue
    max_issues: 10
    # Ashish, 2026-10-09: build without waiting for assignment, and compete on issues others
    # claimed but haven't fixed; the maintainer picks which PR to merge.
    compete: true
    max_open_prs: 3               # Ashish, 2026-10-09: up to three open Kestra PRs at once
    why: "Kestra Hacktober track 01 (Ashish, 2026-10-05; build-first since 2026-10-09)"
    rules: >-
      Kestra Hacktober track 01. Take only issues whose fix is in the Vue/TypeScript UI (ui/)
      or other JavaScript, TypeScript or Python code; skip Java backend issues (no JDK in the
      sandbox). Build directly: don't post a claim or wait to be assigned (your owner's call,
      2026-10-09). Issues assigned to, claimed by or with an open PR from someone else are fair
      game (`taken_by` lists who): build your own fix anyway, and in the PR body's Why section
      say plainly that <who> is also on it and you're offering another option for the
      maintainer to choose from; never criticise their work. Skip an issue only if its fix is
      already merged. When the change is visible in the UI, the PR body gets a "Screenshots"
      section saying before/after screenshots follow from the author, and you log
      `pr-agent log chat.request <pr> "add before/after screenshots" --why "Kestra track rule"`.
      Never star repos or post on social media; your owner does those.

  # The runtime this agent runs on, and the OpenClaw assistant (Ashish, 2026-10-05). Normal
  # build-first lanes; their own AI policy and CONTRIBUTING still decide.
  - repo: NousResearch/hermes-agent
    max_issues: 10
    why: "Hermes, the agent runtime this agent runs on (Ashish, 2026-10-05)"
  - repo: openclaw/openclaw
    max_issues: 10
    why: "OpenClaw (Ashish, 2026-10-05)"

# Issue scope: no type restriction (Ashish, 2026-10-01). Triage decides.
topics:
  - machine-learning
  - deep-learning
  - data-science
  - llm
  - nlp
  - pandas
  - data-analysis
  - computer-vision
  - mlops
  - data-visualization

shapes:
  - "bug report with steps to reproduce and a traceback, wrong result or exception"
  - "regression after upgrading a dependency, error message included"
  - "good first issue small fix, maintainers welcome contributions"
  - "help wanted documented expected vs actual behaviour"
  - "documentation is wrong or missing an example, small clear fix"
  - "small feature request with a clear proposed API, maintainer agreed"

verify:
  repo_pushed_within_days: 60
  issue_updated_within_days: 180
  claim_hard_days: 14            # a claim comment newer than this drops the issue
  claim_window_days: 30          # older claims inside this window are flagged for the model
  min_stars: 200
  max_stars: 30000
  skip_labels: [wontfix, duplicate, invalid, question, discussion, "needs design", "needs decision", blocked, stale, "on hold"]

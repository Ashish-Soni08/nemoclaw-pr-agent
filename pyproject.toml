[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-agent"
version = "0.1.0"
description = "Deterministic tools for the NemoClaw PR agent: discovery, GitHub, ledger, usage guard, run summaries."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
ledger = ["huggingface_hub>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
pr-agent = "pr_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pr_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
